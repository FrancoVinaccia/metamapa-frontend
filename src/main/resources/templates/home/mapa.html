<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <a th:href="@{/landingPage}" id="home-btn"> Inicio</a>

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }

        #home-btn {
            position: fixed;
            bottom: 50px;
            right: 50px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        #home-btn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

    </style>
</head>
<body>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Lista de hechos con coordenadas y enlaces
    const hechos = [
        {
            latitud: 19.4326,
            longitud: -99.1332,
            enlace: 'https://es.wikipedia.org/wiki/Ciudad_de_M%C3%A9xico',
            titulo: 'Ciudad de México'
        },
        {
            latitud: 20.6597,
            longitud: -103.3496,
            enlace: 'https://es.wikipedia.org/wiki/Guadalajara',
            titulo: 'Guadalajara'
        },
        {
            latitud: 25.6866,
            longitud: -100.3161,
            enlace: 'https://es.wikipedia.org/wiki/Monterrey',
            titulo: 'Monterrey'
        }
    ];

    // Inicializar el mapa
    const map = L.map('map').setView([19.4326, -99.1332], 5);

    // Añadir capa del mapa (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Añadir marcadores para cada hecho
    hechos.forEach(hecho => {
        const marcador = L.marker([hecho.latitud, hecho.longitud])
            .addTo(map)
            .bindPopup(`
                    <strong>${hecho.titulo}</strong><br>
                    <a href="${hecho.enlace}" target="_blank">Más información</a>
                `);
    });
</script>
</body>
</html>
