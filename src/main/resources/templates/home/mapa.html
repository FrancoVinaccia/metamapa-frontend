<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <a th:href="@{/landingPage}" id="home-btn"> Inicio</a>

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }

        #home-btn {
            position: fixed;
            bottom: 50px;
            right: 50px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        #home-btn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

    </style>
</head>
<body>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Inicializar el mapa (centrado en Argentina por defecto)
    const map = L.map('map').setView([-38.4161, -63.6167], 4);

    // 2. Añadir capa del mapa (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 3. Función para cargar los hechos desde la API
    // IMPORTANTE: Reemplaza '/api/hechos' por la ruta real de tu controlador que devuelve la lista
    const API_URL = "http://54.232.5.23:8080/agre/priv/hechos/all";
    const requestOptions = {
        method: 'GET',
        headers: {
            'Content-Type': 'application/json',
            'X-ADMIN-TOKEN': 'GRUPO-28'
        }
    };

    fetch(API_URL, requestOptions)
        .then(r => {
            if(!r.ok) {
                if(response.status === 401) console.error("Error 401: No autorizado (Revisa el Header)");
                if(response.status === 403) console.error("Error 403: Prohibido");
                throw new Error("Error al cargar los hechos: " + r.status);
            }
            return r.json();
        })
        .then(data => {
            data.forEach(hecho => {
                if(hecho.lugar && hecho.lugar.latitud && hecho.lugar.longitud) {
                    const lat = hecho.lugar.latitud;
                    const lon = hecho.lugar.longitud;
                    const titulo = hecho.titulo || "Hecho sin título";
                    const id = hecho.idHecho;

                    const urlDetalle = `/hechos/${id}`;

                    L.marker([lat, lon])
                        .addTo(map)
                        .bindPopup(`
                            <strong>${titulo}</strong><br>
                            <a href="${urlDetalle}" target="_blank">Más información</a>
                        `);
                }
            })
        })
        .catch(error => {
            console.error("Error al obtener los hechos:", error);
        });
</script>
</body>
</html>
