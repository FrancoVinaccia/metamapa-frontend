<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <a th:href="@{/landingPage}" id="home-btn"> Inicio</a>

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }

        #home-btn {
            position: fixed;
            bottom: 50px;
            right: 50px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        #home-btn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

    </style>
</head>
<body>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Lista de hechos con coordenadas y enlaces
    const hechos = [
        {
            latitud: 19.4326,
            longitud: -99.1332,
            enlace: 'https://es.wikipedia.org/wiki/Ciudad_de_M%C3%A9xico',
            titulo: 'Ciudad de México'
        },
        {
            latitud: 20.6597,
            longitud: -103.3496,
            enlace: 'https://es.wikipedia.org/wiki/Guadalajara',
            titulo: 'Guadalajara'
        },
        {
            latitud: 25.6866,
            longitud: -100.3161,
            enlace: 'https://es.wikipedia.org/wiki/Monterrey',
            titulo: 'Monterrey'
        },
        {
            latitud: -34.6037,
            longitud: -58.3816,
            enlace: 'https://es.wikipedia.org/wiki/Buenos_Aires',
            titulo: 'Buenos Aires'
        },
        {
            latitud: -31.4201,
            longitud: -64.1888,
            enlace: 'https://es.wikipedia.org/wiki/C%C3%B3rdoba_(Argentina)',
            titulo: 'Córdoba'
        },
        {
            latitud: -32.9442,
            longitud: -60.6505,
            enlace: 'https://es.wikipedia.org/wiki/Rosario_(Argentina)',
            titulo: 'Rosario'
        },
        {
            latitud: -32.8895,
            longitud: -68.8458,
            enlace: 'https://es.wikipedia.org/wiki/Mendoza_(Argentina)',
            titulo: 'Mendoza'
        },
        {
            latitud: -34.9214,
            longitud: -57.9544,
            enlace: 'https://es.wikipedia.org/wiki/La_Plata',
            titulo: 'La Plata'
        },
        {
            latitud: -38.0055,
            longitud: -57.5426,
            enlace: 'https://es.wikipedia.org/wiki/Mar_del_Plata',
            titulo: 'Mar del Plata'
        },
        {
            latitud: -24.7821,
            longitud: -65.4232,
            enlace: 'https://es.wikipedia.org/wiki/Salta_(ciudad)',
            titulo: 'Salta'
        },
        {
            latitud: -26.8206,
            longitud: -65.2176,
            enlace: 'https://es.wikipedia.org/wiki/San_Miguel_de_Tucum%C3%A1n',
            titulo: 'San Miguel de Tucumán'
        },
        {
            latitud: -41.1335,
            longitud: -71.3103,
            enlace: 'https://es.wikipedia.org/wiki/San_Carlos_de_Bariloche',
            titulo: 'San Carlos de Bariloche'
        },
        {
            latitud: -54.8019,
            longitud: -68.3030,
            enlace: 'https://es.wikipedia.org/wiki/Ushuaia',
            titulo: 'Ushuaia'
        },
        {
            latitud: -35.022413,
            longitud: -58.451601,
            enlace: 'https://es.wikipedia.org/wiki/Cabra_Miot%C3%B3nica',
            titulo: 'Casa de Fran'
        }
    ];

    // Inicializar el mapa en argentina
    const map = L.map('map').setView([ -38.4161, -63.6167], 4);
    //const map = L.map('map').setView([19.4326, -99.1332], 5);

    // Añadir capa del mapa (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Añadir marcadores para cada hecho
    hechos.forEach(hecho => {
        const marcador = L.marker([hecho.latitud, hecho.longitud])
            .addTo(map)
            .bindPopup(`
                    <strong>${hecho.titulo}</strong><br>
                    <a href="${hecho.enlace}" target="_blank">Más información</a>
                `);
    });
</script>
</body>
</html>
