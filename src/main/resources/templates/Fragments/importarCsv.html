<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(contenido=~{::body})}">
<body>

<div class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Importar Hechos desde CSV</h1>
            <p class="text-sm text-gray-500">Carga un archivo CSV para importar múltiples hechos de forma masiva</p>
        </div>

        <form id="importarCSVForm" th:action="@{/hechos/importar}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <input type="hidden" name="URL" th:value="${estaticaUrl}" />
            <input type="hidden" name="TOKEN" th:value="${privToken}" />
            <input type="hidden" name="HEADER" th:value="${privHeader}" />

            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-3">
                    Cargar Archivo <span class="text-red-500">*</span>
                </label>

                <div id="uploadArea" class="border-2 border-dashed border-gray-300 rounded-lg p-12 text-center transition-all cursor-pointer bg-gray-50 hover:border-blue-500 hover:bg-blue-50">
                    <div class="text-5xl mb-4">📁</div>
                    <p class="text-lg font-medium text-gray-700 mb-2">Arrastra tu archivo CSV aquí</p>
                    <p class="text-sm text-gray-500 mb-4">o haz clic para seleccionar</p>

                    <label class="inline-block px-6 py-3 bg-blue-600 text-white rounded-lg font-medium cursor-pointer hover:bg-blue-700 transition-colors">
                        Seleccionar archivo
                        <input type="file" id="fileInput" name="file" accept=".csv" class="hidden" required>
                    </label>
                </div>

                <div id="fileInfo" class="hidden mt-4 bg-blue-50 border border-blue-500 rounded-lg p-4 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="text-3xl">📄</div>
                        <div>
                            <p id="fileName" class="font-medium text-gray-900">archivo.csv</p>
                            <p id="fileSize" class="text-sm text-gray-600">0 KB</p>
                        </div>
                    </div>
                    <button type="button" id="btnRemove" class="px-4 py-2 bg-red-500 text-white rounded-lg font-medium hover:bg-red-600 transition-colors">
                        Eliminar
                    </button>
                </div>
            </div>

            <div id="progressContainer" class="hidden mb-6">
                <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden mb-2">
                    <div id="progressFill" class="h-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <p id="progressText" class="text-center text-sm text-gray-600">Procesando... 0%</p>
            </div>

            <div class="flex flex-wrap gap-3 justify-end items-center pt-6 border-t border-gray-200">
                <button type="button" onclick="window.history.back()" class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                    Cancelar
                </button>
                <button type="submit" id="btnImport" disabled class="px-6 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed">
                    Importar Hechos
                </button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('importarCSVForm');
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            const fileSize = document.getElementById('fileSize');
            const btnRemove = document.getElementById('btnRemove');
            const btnImport = document.getElementById('btnImport');
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');

            let selectedFile = null;

            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            }

            function handleFile(file) {
                if (!file) return;

                selectedFile = file;
                fileName.textContent = file.name;
                fileSize.textContent = formatFileSize(file.size);

                fileInfo.classList.remove('hidden');
                uploadArea.style.display = 'none';
                btnImport.disabled = false;
            }

            function resetUpload() {
                selectedFile = null;
                fileInput.value = '';
                fileInfo.classList.add('hidden');
                uploadArea.style.display = 'block';
                btnImport.disabled = true;

                progressContainer.classList.add('hidden');
                progressFill.style.width = '0%';
                progressText.textContent = 'Procesando... 0%';
            }

            uploadArea.addEventListener('click', (e) => {
                if (e.target.closest('label')) return;
                fileInput.click();
            });

            fileInput.addEventListener('change', (e) => {
                const f = e.target.files && e.target.files.length > 0 ? e.target.files[0] : null;
                handleFile(f);
            });

            btnRemove.addEventListener('click', resetUpload);

            form.addEventListener('submit', (e) => {
                const realFile = (fileInput.files && fileInput.files.length > 0) ? fileInput.files[0] : null;
                if (!selectedFile || !realFile) {
                    e.preventDefault();
                    alert('Seleccioná un archivo antes de importar.');
                    return;
                }
                progressContainer.classList.remove('hidden');
                progressFill.style.width = '35%';
                progressText.textContent = 'Subiendo archivo...';
                btnImport.disabled = true;
            });
        });
    </script>
</div>

</body>
</html>
