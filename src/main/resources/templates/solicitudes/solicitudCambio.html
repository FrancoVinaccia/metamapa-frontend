<!DOCTYPE html>
<html th:replace="~{layout/base :: html(contenido=~{::contenido})}" xmlns:th="http://www.thymeleaf.org">

<!-- Content fragment que se inyecta en base.html -->
<div th:fragment="contenido" class="container mx-auto px-4 py-8 max-w-3xl">
    <!-- Page Header -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
        <!-- Header -->
        <div class="mb-6">
            <div class="flex items-center mb-2">
                <svg class="w-6 h-6 text-blue-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <!-- Icono tipo lápiz/edición -->
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15.232 5.232l3.536 3.536M4 20h4.586a1 1 0 0 0 .707-.293l9.414-9.414a2 2 0 0 0 0-2.828l-2.172-2.172a2 2 0 0 0-2.828 0L4.293 14.707A1 1 0 0 0 4 15.414V20z"/>
                </svg>
                <h1 class="text-2xl font-bold text-gray-900">Editar Hecho</h1>
            </div>
            <p class="text-sm text-gray-500">Actualizá la información de este hecho para que siga siendo útil a la comunidad.</p>
        </div>


        <form th:action="@{/solicitudes/crearSolicitudCambio/{idHecho}(idHecho=${idHecho})}"
              th:object="${solicitudCambio}"
              method="post">

            <!-- Si usás Spring Security, no te olvides del CSRF -->
            <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> -->

            <!-- Título -->
            <div class="mb-6">
                <label for="titulo" class="block text-sm font-semibold text-gray-700 mb-2">
                    Título <span class="text-red-500">*</span>
                </label>
                <input
                        type="text"
                        th:field="*{titulo}"
                        id="titulo"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm"
                        placeholder="Ingresa un título descriptivo para tu hecho"
                        maxlength="140">
                <p class="text-xs text-gray-500 mt-1">Máximo 140 caracteres</p>
            </div>

            <!-- Descripción -->
            <div class="mb-6">
                <label for="descripcion" class="block text-sm font-semibold text-gray-700 mb-2">
                    Descripción <span class="text-red-500">*</span>
                </label>
                <input
                        id="descripcion"
                        th:field="*{descripcion}"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm resize-none"
                        placeholder="Describe detalladamente el hecho. Incluye contexto y detalles relevantes..."
                        maxlength="1000">
                <p class="text-xs text-gray-500 mt-1">Máximo 1000 caracteres</p>
            </div>

            <!-- Categoría -->
            <div class="mb-6">
                <label for="categoria" class="block text-sm font-semibold text-gray-700 mb-2">
                    Categoría <span class="text-red-500">*</span>
                </label>
                <input
                        id="categoria"
                        th:field="*{categoria}"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm bg-white">
            </div>

            <!-- Localidad -->
            <div class="mb-4">
                <label for="localidad" class="block text-sm font-semibold text-gray-700 mb-2">
                    Localidad
                </label>
                <input
                        type="text"
                        id="localidad"
                        th:field="*{lugar.localidad}"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm"
                        placeholder="Ej: Palermo">
            </div>

            <!-- Ciudad -->
            <div class="mb-4">
                <label for="ciudad" class="block text-sm font-semibold text-gray-700 mb-2">
                    Ciudad
                </label>
                <input
                        type="text"
                        id="ciudad"
                        th:field="*{lugar.ciudad}"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm"
                        placeholder="Ej: CABA">
            </div>

            <!-- Provincia -->
            <div class="mb-4">
                <label for="provincia" class="block text-sm font-semibold text-gray-700 mb-2">
                    Provincia
                </label>
                <input
                        type="text"
                        id="provincia"
                        th:field="*{lugar.provincia}"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm"
                        placeholder="Ej: Buenos Aires">
            </div>

            <!-- Fecha del hecho -->
            <div class="mb-6 mt-4">
                <label for="fechaAcontecimiento" class="block text-sm font-semibold text-gray-700 mb-2">
                    Fecha del hecho <span class="text-red-500">*</span>
                </label>
                <input
                        id="fechaAcontecimiento"
                        th:field="*{fechaAcontecimiento}"
                        placeholder="Escriba el formato de la fecha como dd/mm/aaaa"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm">
                <p class="text-xs text-gray-500 mt-1">Selecciona la fecha en que ocurrió el hecho</p>
            </div>

            <!-- (Opcional) Si querés anonimato, tendrías que agregar publicadoAnonimo al DTO -->
            <!--
            <div class="mb-6 flex items-start">
                <div class="flex items-center h-5">
                    <input
                            id="anonimo"
                            type="checkbox"
                            th:field="*{publicadoAnonimo}"
                            class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300 rounded">
                </div>
                <div class="ml-3 text-sm">
                    <label for="anonimo" class="font-medium text-gray-700">
                        Publicar de forma anónima
                    </label>
                    <p class="text-gray-500">
                        Si seleccionas esta opción, tus datos personales no serán asociados a esta contribución.
                    </p>
                </div>
            </div>
            -->

            <!-- Botones -->
            <div class="flex flex-wrap gap-3 justify-between items-center pt-6 border-t border-gray-200">
                <div class="flex gap-3">
                    <button
                            type="button"
                            onclick="window.history.back()"
                            class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                        Cancelar
                    </button>
                    <button
                            type="submit"
                            class="px-6 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors flex items-center">
                        <i class="fas fa-save mr-2"></i>
                        Guardar cambios
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
</html>
