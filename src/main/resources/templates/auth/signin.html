<html th:replace="~{layout/base :: html(contenido=~{::contenido})}"
      xmlns:th="http://www.thymeleaf.org">

<div th:fragment="contenido"
     class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 py-20 px-4">

    <div class="w-full max-w-md bg-white/90 backdrop-blur-sm border border-gray-200 shadow-xl rounded-2xl p-10 transform transition-all hover:shadow-2xl">
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <svg class="w-10 h-10 text-indigo-600" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 2.18l8 3.6v7.22c0 4.52-3.13 8.78-8 9.82-4.87-1.04-8-5.3-8-9.82V7.78l8-3.6z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </div>

        <h1 class="text-3xl font-bold text-center text-gray-900 mb-2">Crear una cuenta</h1>
        <p class="text-center text-gray-500 mb-8 text-sm">Completá tus datos para unirte a MetaMapa</p>

        <!-- Mensajes -->
        <div th:if="${param.error}" class="mb-4 text-sm text-red-600 text-center">
            Error al crear la cuenta. Revisá los campos.
        </div>

        <form th:action="@{/signin/submit}" method="post" class="space-y-5">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                    <input id="nombre" name="nombre" type="text" required
                           class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition">
                </div>

                <div>
                    <label for="apellido" class="block text-sm font-medium text-gray-700 mb-1">Apellido</label>
                    <input id="apellido" name="apellido" type="text" required
                           class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition">
                </div>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                <input id="email" name="email" type="email" required
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input id="password" name="password" type="password" required minlength="6"
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition">
                <p class="text-xs text-gray-400 mt-1">Mínimo 6 caracteres</p>
            </div>

            <div>
                <label for="fechaNacimiento" class="block text-sm font-medium text-gray-700 mb-1">Fecha de nacimiento</label>
                <input id="fechaNacimiento" name="fechaNacimiento" type="date" required
                       class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition">
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow-md transition-colors">
                Registrarse
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-600">
            ¿Ya tenés una cuenta?
            <a th:href="@{/login/formulario}" class="text-indigo-600 hover:text-indigo-700 font-semibold">
                Iniciá sesión
            </a>
        </p>
    </div>
</div>
</html>
