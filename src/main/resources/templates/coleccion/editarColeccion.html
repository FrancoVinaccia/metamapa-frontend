<!DOCTYPE html>
<html th:replace="~{layout/base :: html(contenido=~{::contenido})}" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="contenido" class="container mx-auto px-4 py-8 max-w-3xl">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Editar Colección</h1>
            <p class="text-sm text-gray-500">Modificá los detalles de la colección.</p>
        </div>

        <form th:action="@{/colecciones/actualizar/{id}(id=${idColeccion})}" th:object="${coleccion}" method="post" class="space-y-6">

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Título <span class="text-red-500">*</span></label>
                <input type="text" th:field="*{titulo}" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" required maxlength="140" />
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Descripción <span class="text-red-500">*</span></label>
                <textarea th:field="*{descripcion}" rows="4" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" required maxlength="1000"></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Categoría</label>
                <input type="text" th:field="*{criterios.categoria}" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
            </div>

            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Fecha inicio</label>
                    <input th:field="*{criterios.fecha.fechaInicio}" type="text" placeholder="dd/mm/aaaa" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg" />
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Fecha fin</label>
                    <input th:field="*{criterios.fecha.fechaFin}" type="text" placeholder="dd/mm/aaaa" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg" />
                </div>
            </div>

            <div class="grid md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Localidad</label>
                    <input type="text" th:field="*{criterios.lugar.localidad}" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg" />
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Ciudad</label>
                    <input type="text" th:field="*{criterios.lugar.ciudad}" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg" />
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Provincia</label>
                    <input type="text" th:field="*{criterios.lugar.provincia}" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg" />
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Método de consenso</label>
                <select th:field="*{metodoConsenso}" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg">
                    <option value="BASICO">Básico</option>
                    <option value="MULTIPLESMENCIONES">Múltiples menciones</option>
                    <option value="ABSOLUTA">Absoluta</option>
                    <option value="MAYORIASIMPLE">Mayoría simple</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Fuentes</label>
                <div class="space-y-2">
                    <label class="flex items-center gap-2"><input type="checkbox" name="fuentes" value="Dinamica" th:checked="${coleccion.fuentes != null && coleccion.fuentes.contains('Dinamica')}" /> Dinámica</label>
                    <label class="flex items-center gap-2"><input type="checkbox" name="fuentes" value="Proxy" th:checked="${coleccion.fuentes != null && coleccion.fuentes.contains('Proxy')}" /> Proxy</label>
                    <label class="flex items-center gap-2"><input type="checkbox" name="fuentes" value="Estatica" th:checked="${coleccion.fuentes != null && coleccion.fuentes.contains('Estatica')}" /> Estática</label>
                </div>
            </div>

            <div class="pt-6 border-t border-gray-200 flex gap-3">
                <a th:href="@{/colecciones/{id}(id=${idColeccion})}" class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">Cancelar</a>
                <button type="submit" class="px-6 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">Guardar Cambios</button>
            </div>
        </form>
    </div>
</div>
</html>
