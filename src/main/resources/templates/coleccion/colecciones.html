<!DOCTYPE html>
<html th:replace="~{layout/base :: html(contenido=~{::contenido})}" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="contenido">
  <!-- Header -->
  <section class="border-b border-gray-200 py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-bold text-gray-900 text-center mb-2">Colecciones</h1>
      <p class="text-gray-600 text-center">Explora todas las colecciones disponibles</p>
    </div>
  </section>

  <!-- Lista de colecciones (sin filtros) -->
  <section class="py-8 bg-gray-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <!-- contador -->
      <div class="mb-6 text-sm text-gray-600">
        <span th:text="${totalColecciones != null ? totalColecciones : 0}">0</span> colecciones encontradas
      </div>

      <!-- grid de colecciones -->
      <div class="grid md:grid-cols-3 gap-6"
           th:if="${colecciones != null and #lists.size(colecciones) > 0}">
        <div th:each="coleccion : ${colecciones}">
          <div th:replace="~{coleccion/cardColeccion :: cardColeccion(coleccion=${coleccion})}"></div>
        </div>
      </div>

      <!-- estado vacío -->
      <div th:if="${colecciones == null or #lists.isEmpty(colecciones)}"
           class="text-center py-16">
        <i class="fas fa-folder-open text-6xl text-gray-300 mb-4"></i>
        <h3 class="text-xl font-semibold text-gray-900 mb-2">No se encontraron colecciones</h3>
        <p class="text-gray-600">Aún no hay colecciones disponibles para mostrar.</p>
      </div>

      <!-- paginación -->
      <div th:if="${colecciones != null and #lists.size(colecciones) > 0}"
           class="mt-8 flex justify-center">
        <nav class="flex items-center gap-2">
          <a th:href="@{/colecciones(page=${currentPage - 1})}"
             th:classappend="${currentPage == 1} ? 'opacity-50 pointer-events-none' : ''"
             class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
            <i class="fas fa-chevron-left"></i>
          </a>

          <span class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700">
            Página <strong th:text="${currentPage != null ? currentPage : 1}">1</strong>
          </span>

          <a th:if="${colecciones != null and #lists.size(colecciones) >= pageSize}"
             th:href="@{/colecciones(page=${currentPage + 1})}"
             class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
            <i class="fas fa-chevron-right"></i>
          </a>
        </nav>
      </div>
    </div>
  </section>
</div>
</html>
