<div th:fragment="cardColeccion(coleccion)" xmlns:th="http://www.thymeleaf.org"
     th:if="${coleccion != null}"
     class="bg-white rounded-xl overflow-hidden shadow-md card-hover border border-gray-200"
     th:with="ph=@{/img/placeholder.jpg}">

    <img class="w-full h-48 object-cover"
         th:src="${coleccion != null and coleccion.imagen != null and !#strings.isEmpty(coleccion.imagen)} ? ${coleccion.imagen} : ${ph}"
         th:alt="${coleccion != null and coleccion.titulo != null ? coleccion.titulo : 'Colección'}" />

    <div class="p-6">
        <h3 class="text-xl font-semibold text-gray-900 mb-2"
            th:text="${coleccion != null and coleccion.titulo != null ? coleccion.titulo : 'Título'}">Título</h3>

        <p class="text-gray-600 mb-4"
           th:text="${coleccion != null and coleccion.descripcion != null ? coleccion.descripcion : 'Descripción'}">Descripción</p>

        <p class="text-gray-600 mb-4"
           th:text="${coleccion != null and coleccion.idColeccion != null ? coleccion.idColeccion : 'Id'}"> coso temporal para ver Id</p>


        <a th:href="@{/colecciones/{id}(id=${coleccion.idColeccion})}"
           class="text-indigo-600 hover:text-indigo-700 font-medium inline-flex items-center">
            Ver colección
            <i class="fas fa-arrow-right ml-2 text-sm"></i>
        </a>
    </div>
</div>
