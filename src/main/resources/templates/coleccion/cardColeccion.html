<div th:fragment="cardColeccion(coleccion)"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     th:if="${coleccion != null}"
     class="bg-white rounded-xl overflow-hidden shadow-md card-hover border border-gray-200 flex flex-col h-full"
     th:with="ph=@{/img/placeholder.jpg}">

    <img class="w-full h-48 object-cover"
         th:src="${coleccion != null and coleccion.imagen != null and !#strings.isEmpty(coleccion.imagen)} ? ${coleccion.imagen} : ${ph}"
         th:alt="${coleccion != null and coleccion.titulo != null ? coleccion.titulo : 'Colección'}" />

    <div class="p-6 flex flex-col flex-grow">
        <h3 class="text-xl font-semibold text-gray-900 mb-2"
            th:text="${coleccion != null and coleccion.titulo != null ? coleccion.titulo : 'Título'}">
            Título
        </h3>

        <p class="text-gray-600 mb-4 flex-grow line-clamp-3"
           th:text="${coleccion != null and coleccion.descripcion != null ? coleccion.descripcion : 'Descripción'}">
            Descripción
        </p>

        <div class="flex items-center justify-between mt-auto pt-4 border-t border-gray-100">

            <a th:href="@{/colecciones/{id}(id=${coleccion.idColeccion})}"
               class="text-indigo-600 hover:text-indigo-700 font-medium inline-flex items-center group">
                Ver colección
                <i class="fas fa-arrow-right ml-2 text-sm transition-transform group-hover:translate-x-1"></i>
            </a>

            <a sec:authorize="hasRole('ADMINISTRADOR')"
               th:href="@{/colecciones/editar/{id}(id=${coleccion.idColeccion})}"
               class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors flex items-center shadow-sm">
                <i class="fas fa-edit mr-2"></i>
                Editar
            </a>

        </div>
    </div>
</div>
