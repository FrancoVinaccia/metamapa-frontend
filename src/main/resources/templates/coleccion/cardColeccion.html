<!-- templates/coleccion/cardColeccion.html -->
<div th:fragment="cardColeccion(coleccion)"
     th:if="${coleccion != null}"
     class="bg-white rounded-xl overflow-hidden shadow-md card-hover border border-gray-200">

    <!-- Sin th:src porque ColeccionDTO no tiene 'imagen' -->
    <div class="w-full h-48 bg-gray-200"></div>

    <div class="p-6">
        <h3 class="text-xl font-semibold text-gray-900 mb-2"
            th:text="${coleccion.titulo != null ? coleccion.titulo : 'Título'}">Título</h3>

        <p class="text-gray-600 mb-4"
           th:text="${coleccion.descripcion != null ? coleccion.descripcion : 'Descripción'}">Descripción</p>

        <a th:href="@{/coleccion/{id}(id=${coleccion.id != null ? coleccion.id : 0})}"
           class="text-indigo-600 hover:text-indigo-700 font-medium inline-flex items-center">
            Ver colección
            <i class="fas fa-arrow-right ml-2 text-sm"></i>
        </a>
    </div>
</div>
