<!DOCTYPE html>
<html th:replace="~{layout/base :: html(contenido=~{::contenido})}" xmlns:th="http://www.thymeleaf.org">

<!-- Content fragment that will be injected into base.html -->
<div th:fragment="contenido" class="container mx-auto px-4 py-8 max-w-3xl">
    <!-- Page Header -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
        <!-- Header -->
        <div class="mb-6">
            <div class="flex items-center mb-2">
                <svg class="w-6 h-6 text-blue-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <h1 class="text-2xl font-bold text-gray-900">Crear Nuevo Hecho</h1>
            </div>
            <p class="text-sm text-gray-500">Comparte información importante con la comunidad</p>
        </div>

        <!-- Form -->
        <form th:action=" @{/hechos/crear}" th:object="${hecho}" method="post">
            <!-- Título -->
            <div class="mb-6">
                <label for="titulo" class="block text-sm font-semibold text-gray-700 mb-2">
                    Título <span class="text-red-500">*</span>
                </label>
                <input
                        type="text"
                        th:field="*{titulo}"
                        id="titulo"
                        name="titulo"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm"
                        placeholder="Ingresa un título descriptivo para tu hecho"
                        maxlength="140"
                        required
                >
                <p class="text-xs text-gray-500 mt-1">Máximo 140 caracteres</p>
            </div>

            <!-- Descripción -->
            <div class="mb-6">
                <label for="descripcion" class="block text-sm font-semibold text-gray-700 mb-2">
                    Descripción <span class="text-red-500">*</span>
                </label>
                <input
                        id="descripcion"
                        name="descripcion"
                        th:field="*{descripcion}"
                        rows="5"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm resize-none"
                        placeholder="Describe detalladamente el hecho. Incluye contexto y detalles relevantes..."
                        maxlength="1000"
                        required
                >
                <p class="text-xs text-gray-500 mt-1">Máximo 1000 caracteres</p>
            </div>

                        <!-- Categoría y Ubicación -->
            <div class="grid md:grid-cols-2 gap-6 mb-6">

                <!-- Categoría -->
                <div>
                    <label for="categoria" class="block text-sm font-semibold text-gray-700 mb-2">
                        Categoría <span class="text-red-500">*</span>
                    </label>
                    <input
                            id="categoria"
                            th:field="*{categoria}"
                            name="categoria"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm bg-white"
                            required
                    >
                </div>
            </div>


            <!-- Localidad -->
            <div>
                <label for="localidad" class="block text-sm font-semibold text-gray-700 mb-2">
                    Localidad
                </label>
                <input
                        type="text"
                        id="localidad"
                        th:field="*{lugar.localidad}"
                        name="localidad"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm"
                        placeholder="Ej: Palermo"
                >
            </div>

            <!-- Ciudad -->
            <div>
                <label for="ciudad" class="block text-sm font-semibold text-gray-700 mb-2">
                    Ciudad
                </label>
                <input
                        type="text"
                        id="ciudad"
                        th:field="*{lugar.ciudad}"
                        name="ciudad"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm"
                        placeholder="Ej: CABA"
                >
            </div>

            <!-- Provincia -->
            <div>
                <label for="provincia" class="block text-sm font-semibold text-gray-700 mb-2">
                    Provincia
                </label>
                <input
                        type="text"
                        id="provincia"
                        th:field="*{lugar.provincia}"
                        name="provincia"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm"
                        placeholder="Ej: Buenos Aires"
                >
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="latitud" class="block text-xs font-medium text-gray-600 mb-1">Latitud</label>
                    <input
                            id="latitud"
                            th:field="*{lugar.latitud}"
                            type="number"
                            step="any"
                            required
                            placeholder="ej. -34.6037"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                    />
                    <p th:if="${#fields.hasErrors('lugar.latitud')}" th:errors="*{lugar.latitud}" class="text-xs text-red-600 mt-1"></p>
                </div>

                <div>
                    <label for="longitud" class="block text-xs font-medium text-gray-600 mb-1">Longitud</label>
                    <input
                            id="longitud"
                            th:field="*{lugar.longitud}"
                            type="number"
                            step="any"
                            required
                            placeholder="ej. -58.3816"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                    />
                    <p th:if="${#fields.hasErrors('lugar.longitud')}" th:errors="*{lugar.longitud}" class="text-xs text-red-600 mt-1"></p>
                </div>
            </div>


            <!-- Fecha del Hecho -->
            <div class="mb-6">
                <label for="fecha" class="block text-sm font-semibold text-gray-700 mb-2">
                    Fecha del hecho <span class="text-red-500">*</span>
                </label>
                <input
                        id="fecha"
                        th:field="*{fecha}"
                        name="fecha"
                        placeholder="Escriba el formato de la fecha como dd/mm/aaaa"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-sm"
                        required
                >
                <p class="text-xs text-gray-500 mt-1">Selecciona la fecha en que ocurrió el hecho</p>
            </div>

            <!-- Multimedia
            <div class="mb-8">
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Multimedia
                </label>
                <div class="upload-area rounded-lg p-8 text-center cursor-pointer" id="uploadArea">
                    <input
                            type="file"
                            id="archivos"
                            name="archivos"
                            class="hidden"
                            accept="image/jpeg,image/png,image/gif,video/mp4"
                            multiple
                    >
                    <div class="flex flex-col items-center">
                        <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-4">
                            <i class="fas fa-cloud-upload-alt text-blue-500 text-2xl"></i>
                        </div>
                        <p class="text-sm font-medium text-gray-700 mb-1">
                            Arrastra archivos aquí
                        </p>
                        <p class="text-xs text-gray-500 mb-3">
                            o selecciona archivos
                        </p>
                        <p class="text-xs text-gray-400">
                            Formatos aceptados: JPG, PNG, GIF, MP4 (máx. 10MB)
                        </p>
                    </div>
                </div>
                <div id="fileList" class="mt-3 space-y-2"></div>
            </div>
            -->

            <!-- Buttons -->
            <div class="mb-6 flex items-start">
                <div class="flex items-center h-5">
                    <input
                            id="anonimo"
                            type="checkbox"
                            th:field="*{publicadoAnonimo}"
                            class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300 rounded"
                    >
                </div>
                <div class="ml-3 text-sm">
                    <label for="anonimo" class="font-medium text-gray-700">
                        Publicar de forma anónima
                    </label>
                    <p class="text-gray-500">
                        Si seleccionas esta opción, tus datos personales no serán asociados a esta contribución.
                    </p>
                </div>
            </div>


            <div class="flex flex-wrap gap-3 justify-between items-center pt-6 border-t border-gray-200">

                <div class="flex gap-3">
                    <button
                            type="button"
                            onclick="window.history.back()"
                            class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
                    >
                        Cancelar
                    </button>
                    <button
                            type="submit"
                            class="px-6 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors flex items-center"
                    >
                        <i class="fas fa-paper-plane mr-2"></i>
                        Publicar Hecho
                    </button>
                </div>
            </div>



        </form>
    </div>
</div>
</html>
