<!DOCTYPE html>
<html th:replace="~{layout/base :: html(contenido=~{::contenido})}" xmlns:th="http://www.thymeleaf.org">

<!-- Content fragment that will be injected into base.html -->
<div th:fragment="contenido">
    <!-- Page Header -->
    <section class="border-b border-gray-200 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-3xl font-bold text-gray-900 text-center mb-2">Hechos</h1>
            <p class="text-gray-600 text-center">Explora todos los hechos documentados</p>
        </div>
    </section>

    <!-- Filters Section -->
    <section class="bg-gray-50 border-b border-gray-200 py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <form th:action="@{/hechos}" method="get" class="space-y-4">
                <!-- Reset la página cuando se aplican filtros -->
                <input type="hidden" name="page" value="1" />

                <!-- Filter Row 1 -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <!-- Categoría -->
                    <div>
                        <label class="flex items-center text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-folder text-blue-500 mr-2"></i>
                            Categoría
                        </label>
                        <input type="text"
                               name="categoria"
                               placeholder="Ej: protesta, evento"
                               th:value="${categoria}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <!-- Provincia -->
                    <div>
                        <label class="flex items-center text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-map text-blue-500 mr-2"></i>
                            Provincia
                        </label>
                        <input type="text"
                               name="provincia"
                               placeholder="Ej: Buenos Aires"
                               th:value="${provincia}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <!-- Ciudad -->
                    <div>
                        <label class="flex items-center text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-city text-blue-500 mr-2"></i>
                            Ciudad
                        </label>
                        <input type="text"
                               name="ciudad"
                               placeholder="Ej: Córdoba"
                               th:value="${ciudad}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <!-- Localidad -->
                    <div>
                        <label class="flex items-center text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-map-marker-alt text-blue-500 mr-2"></i>
                            Localidad
                        </label>
                        <input type="text"
                               name="localidad"
                               placeholder="Ej: Villa Carlos Paz"
                               th:value="${localidad}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <!-- Filter Row 2 - Dates and Source -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <!-- Fecha Inicio -->
                    <div>
                        <label class="flex items-center text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-calendar text-blue-500 mr-2"></i>
                            Fecha Inicio
                        </label>
                        <input type="date"
                               name="fechaInicio"
                               th:value="${fechaInicio}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <!-- Fecha Fin -->
                    <div>
                        <label class="flex items-center text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-calendar-check text-blue-500 mr-2"></i>
                            Fecha Fin
                        </label>
                        <input type="date"
                               name="fechaFin"
                               th:value="${fechaFin}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <!-- Carga Origen -->
                    <div>
                        <label class="flex items-center text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-database text-blue-500 mr-2"></i>
                            Carga Origen
                        </label>
                        <select name="cargaOrigen"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value=""
                                    th:selected="${cargaOrigen == null or cargaOrigen == ''}">
                                Todas las cargas
                            </option>
                            <option value="oficial"
                                    th:selected="${cargaOrigen == 'oficial'}">
                                Oficial
                            </option>
                            <option value="comunidad"
                                    th:selected="${cargaOrigen == 'comunidad'}">
                                Comunidad
                            </option>
                            <option value="verificado"
                                    th:selected="${cargaOrigen == 'verificado'}">
                                Verificado
                            </option>
                            <option value="pendiente"
                                    th:selected="${cargaOrigen == 'pendiente'}">
                                Pendiente Verificación
                            </option>
                        </select>
                    </div>
                </div>

                <!-- Checkbox para Mis Hechos -->
                <div class="flex items-center">
                    <input type="checkbox"
                           name="misHechos"
                           value="true"
                           id="misHechos"
                           th:checked="${misHechos == 'true'}"
                           class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-2 focus:ring-blue-500">
                    <label for="misHechos" class="ml-2 text-sm text-gray-700">
                        Solo mostrar mis hechos
                    </label>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3">
                    <button type="submit"
                            class="px-6 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-colors flex items-center">
                        <i class="fas fa-filter mr-2"></i>
                        Aplicar Filtros
                    </button>
                    <button type="button"
                            th:onclick="|window.location.href='@{/hechos}'|"
                            class="px-6 py-2 bg-white text-gray-700 border border-gray-300 rounded-lg font-medium hover:bg-gray-50 transition-colors flex items-center">
                        <i class="fas fa-undo mr-2"></i>
                        Limpiar
                    </button>
                </div>
            </form>
        </div>
    </section>

    <!-- Results Section -->
    <section class="py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- Results Count -->
            <div class="mb-6 text-sm text-gray-600">
                <span th:text="${totalDeHechos != null ? totalDeHechos : 0}">0</span> hechos encontrados
            </div>

            <!-- Facts Grid -->
            <div class="grid md:grid-cols-3 gap-6"
                 th:if="${hechos != null and #lists.size(hechos) > 0}">
                <div th:each="hecho : ${hechos}">
                    <div th:replace="~{hecho/cardHecho :: cardHecho(hecho=${hecho})}"></div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${hechos == null or #lists.isEmpty(hechos)}" class="text-center py-16">
                <i class="fas fa-search text-6xl text-gray-300 mb-4"></i>
                <h3 class="text-xl font-semibold text-gray-900 mb-2">No se encontraron hechos</h3>
                <p class="text-gray-600">Intenta ajustar los filtros o contribuye documentando un nuevo hecho</p>
            </div>

            <!-- Pagination dinámico -->
            <div th:if="${hechos != null and #lists.size(hechos) > 0}" class="mt-8 flex justify-center">
                <nav class="flex items-center gap-2">
                    <!-- Anterior: deshabilitado si currentPage == 1 -->
                    <a th:href="@{/hechos(
                            page=${currentPage - 1},
                            categoria=${categoria},
                            provincia=${provincia},
                            ciudad=${ciudad},
                            localidad=${localidad},
                            fechaInicio=${fechaInicio},
                            fechaFin=${fechaFin},
                            cargaOrigen=${cargaOrigen},
                            misHechos=${misHechos}
                        )}"
                       th:classappend="${currentPage == 1} ? 'opacity-50 pointer-events-none' : ''"
                       class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                        <i class="fas fa-chevron-left"></i>
                    </a>

                    <!-- Indicador simple de página -->
                    <span class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700">
                        Página <strong th:text="${currentPage != null ? currentPage : 1}">1</strong>
                    </span>

                    <!-- Siguiente: sólo mostrar si la cantidad de hechos en la página es igual al pageSize (posible más páginas) -->
                    <a th:if="${hechos != null and #lists.size(hechos) >= pageSize}"
                       th:href="@{/hechos(
                            page=${currentPage + 1},
                            categoria=${categoria},
                            provincia=${provincia},
                            ciudad=${ciudad},
                            localidad=${localidad},
                            fechaInicio=${fechaInicio},
                            fechaFin=${fechaFin},
                            cargaOrigen=${cargaOrigen},
                            misHechos=${misHechos}
                        )}"
                       class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </nav>
            </div>
        </div>
    </section>
</div>
</html>
