<div th:fragment="cardHecho(hecho) "
     th:if="${hecho != null}"
     class="bg-white rounded-xl overflow-hidden shadow-md card-hover border border-gray-200"
     th:with="ph=@{/img/placeholder.jpg}" xmlns:th="http://www.w3.org/1999/xhtml">

    <img class="w-full h-48 object-cover"
         th:src="${hecho != null and hecho.imagen != null and !#strings.isEmpty(hecho.imagen)} ? ${hecho.imagen} : ${ph}"
         th:alt="${hecho != null and hecho.titulo != null ? hecho.titulo : 'Hecho'}" />

    <div class="p-6">
        <h3 class="text-xl font-semibold text-gray-900 mb-2"
            th:text="${hecho != null and hecho.titulo != null ? hecho.titulo : 'Título del Hecho'}">Título del Hecho</h3>

        <p class="text-gray-600 mb-4"
           th:text="${hecho != null and hecho.descripcion != null ? hecho.descripcion : 'Descripción del hecho'}">Descripción del hecho</p>

        <div class="flex gap-3 mb-4">
            <a th:href="@{/solicitudes/solicitudCambio/{idHecho}(idHecho=${hecho.idHecho})}"
               class="btn-editar px-6 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors flex items-center">
                <i class="fas fa-edit mr-2"></i>
                Editar
            </a>

            <a
                    href="#"
                    class="btn-eliminar px-6 py-2.5 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors flex items-center"
                    th:attr="data-id=${hecho.idHecho},data-titulo=${hecho.titulo}"
                    onclick="handleEliminarClick(this); return false;">
                <i class="fas fa-trash mr-2"></i>
                Eliminar
            </a>
        </div>

        <a th:href="@{/hechos/{id}(id=${hecho.idHecho})}"
           class="text-indigo-600 hover:text-indigo-700 font-medium inline-flex items-center">
            Ver hecho
            <i class="fas fa-arrow-right ml-2 text-sm"></i>
        </a>
    </div>
</div>
